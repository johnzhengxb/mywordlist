<!DOCTYPE html>

<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=0.8" name="viewport"/>
<head>
<style class="audio-player">

   html, body {
        overflow-y:scroll !important; /* Keep vertical scrolling bar*/
        height: 100%; /* Locks height to the viewport */
        background-color: transparent !important;
        }

    .audio-card {
                    display: flex;
                    align-items: center;
                    gap: 1px;
                    margin-bottom: 12px;
                    margin-top: 12px;
                    padding: 1px 1px;
                    border-radius: 12px;
                    max-width: 100%;
            }

        button.custom-play-btn {
                height: 60px;
                background-color: #0c427b;
                color: white;
                width: 100%;
                border: none;
                border-radius: 10px;
                padding: 8px 8px;
                font-size: 1rem;
                font-weight: 500;
                cursor: pointer;
                transition: background-color 0.2s ease;
        }

        .custom-play-btn:hover {
            background-color: #0056b3;
        }

        span.pr {
            display:none;
        }
</style>
<style>

    div.phonetics-syllables-entry {
        display: none;
    }

    /* Optional basic styling for buttons */
    .word-syllables-entry {
        display: flex;
        gap: 2px; 
        border-radius: 8px;
        background-color: rgb(25, 39, 39);
        padding-left: 2rem;
    }
    .word-syllables-entry button {
            border-radius: 6px;
            font-size:2rem !important;
            margin: 10px 0px;
            padding: 1px 4px;
            font-size: 16px;
            cursor: pointer;
            border: 1px solid #ccc;
            background-color: #efe8e8;
            transition: background-color 0.2s;
        }
</style>
<style class="Pagination">
   html, body {
        overflow-y:scroll !important; /* Keep vertical scrolling bar*/
        height: 100%; /* Locks height to the viewport */
        background-color: transparent !important;
        }
    
    div.pagination-controls {
        width: 100% !important;
        font-size: 1 rem !important;
        position: fixed;
        bottom: 50px;
        left: 0;
        padding-right: 30px;
        display: flex;
        gap: 15px;
        align-items: center;
        z-index: 1000; /* Keeps it above other elements */
     }

   #prev-btn, #next-btn {
        width: 25%;
        height: 60px;
        border-radius: 8px;
        background-color: darkgreen;
   }

   #page-indicator {
        display: inline-block;
        padding-left: 10%;
        text-align:center;
        margin-left: auto;
        margin-right: auto;
   }

   #next-btn {
        margin-left: auto; /* 下一页按钮靠右对齐*/
   }

   .page-item {
        display: none;  /* Hide all items by default */
    }

   .page-item.active {
        display: block; /* Only show items belonging to the active page */
        height: 100% !important;
    }
  </style>
<style class="Heading">
   h1 {
          width: 100% !important;

<link href="https://merriam-webster.com/assets/mw/dist/compiled/css/style-dsp-redesign-definitions.1f89efcf6947f2d77ef5.css" media="screen" rel="stylesheet"/>

<script class="Audio-player">
   document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.audio-card').forEach(card => {
        const audio = card.querySelector('audio');
        const btn = card.querySelector('.custom-play-btn');

        // Safety check in case elements are missing
        if (!audio || !btn) return;

        btn.addEventListener('click', () => {

          // Toggle current audio playback
          if (audio.paused) {
            audio.play().catch(error => {
              console.log("Playback failed:", error);
            });
            btn.getElementsByClassName("pr")[0].style.display="inline";
          } else {
            audio.pause();
            // btn.textContent = '▶ Play';
          }
        });

        // Reset button text back to "Play" when the audio clip ends naturally
        audio.addEventListener('ended', () => {
          //btn.textContent = '▶ Play';
        });
      });
    });
</script>
<script class="syllables">
    document.addEventListener('DOMContentLoaded', () => {
    // 1. Select all buttons inside the specific container
    
    const buttons = document.querySelectorAll('.word-syllables-entry button');

    // 2. Loop through each button and track its index position
    buttons.forEach((button, index) => {
        button.addEventListener('mousedown', () => {
            if (button.className === "stress") {
                button.style.backgroundColor = 'green';
            } else {
            // For all other buttons
                button.style.backgroundColor = 'red';
            }
        });
    });
    buttons.forEach((button, index) => {
    button.addEventListener('mouseup', () => {
            if (button.className === "stress") {
                button.style.backgroundColor = 'green';
            } else {
            // For all other buttons
                button.style.backgroundColor= "#efe8e8"
            }
        });
    });
})
</script>
<script class="Pagination">
   document.addEventListener('DOMContentLoaded', () => {
        const items = document.querySelectorAll('.page-item');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const pageIndicator = document.getElementById('page-indicator');

        let currentPage = 1;
        const itemsPerPage = 1; // Change this to how many items you want per page
        const totalPages = Math.ceil(items.length / itemsPerPage);

        function showPage(page) {
        console.log ("page=")
        console.log(page)
        console.log("totalPages=")
        console.log(totalPages)


        if(page>totalPages){page=1};// 循环
        currentPage = page;
        console.log ("currentPage=")
        console.log(currentPage)

        const start = (currentPage - 1) * itemsPerPage;
        const end = start + itemsPerPage;
        console.log("start=")
        console.log(start)
        console.log("end=")
        console.log(end)
        console.log("currentPage=")
        console.log(currentPage)

        items.forEach((item, index) => {
        if (index >= start && index < end) {
                item.classList.add('active');
                console.log ("active added")
                item.getElementsByTagName("audio")[0].play();
        } else {
                item.classList.remove('active');
        }
        });

        // Update indicator and button states
        pageIndicator.textContent = `Page ${currentPage} of ${totalPages}`;
        prevBtn.disabled = currentPage === 1;
        nextBtn.disabled = currentPage === totalPages || totalPages === 0;
        }

        prevBtn.addEventListener('click', () => {
        if (currentPage > 1) showPage(currentPage - 1);
        });

        nextBtn.addEventListener('click', () => {
        console.log("next clicked")
        if (currentPage < totalPages) {
            showPage(currentPage + 1);
        }

        });

        // Initialize first page view
        showPage(1);

        });
  </script>
</head>
