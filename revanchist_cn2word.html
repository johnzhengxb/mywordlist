<!DOCTYPE html>

<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=0.8" name="viewport"/>
<style class="audio-player">

   html, body {
        
        height: 100%; /* Locks height to the viewport */
        background-color: transparent !important;
        }

    .audio-card {
            display:block;
            width: 440px;
            margin:12px 12px;
            padding:0px 0px;
            }

    button.custom-play-btn {
                height: 40px;
                background-color: #0c427b;
                color: white;
                width: 100%;
                border: none;
                border-radius: 10px;
                padding: 8px 8px;
                font-size: 1rem;
                font-weight: 500;
                cursor: pointer;
                transition: background-color 0.2s ease;
        }

        .custom-play-btn:hover {
            background-color: #0056b3;
        }

        span.pr {
            display:none;
        }
</style>
<script class="Audio-player">
   document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.audio-card').forEach(card => {
        const audio = card.querySelector('audio');
        const btn = card.querySelector('.custom-play-btn');

        // Safety check in case elements are missing
        if (!audio || !btn) return;

        btn.addEventListener('click', () => {

          // Toggle current audio playback
          if (audio.paused) {
            audio.play().catch(error => {
              console.log("Playback failed:", error);
            });
            btn.getElementsByClassName("pr")[0].style.display="inline";
          } else {
            audio.pause();
            // btn.textContent = '▶ Play';
          }
        });

        // Reset button text back to "Play" when the audio clip ends naturally
        audio.addEventListener('ended', () => {
          //btn.textContent = '▶ Play';
        });
      });
    });
</script>
<style class="TextInput">
        /* Select the text box */
        div.page-item {
            width: 400px;

            border-radius: 8px;        /* Modern rounded corners */
            outline: none;
            transition: all 0.15s ease-in-out; /* Smooth transition for focus effects */
        }

        input.correct {
            background-color: aquamarine;
            transition:none;
        }
        /* Modern focus state (glow/border color change) */
        input[type="text"]:focus {
            border-color: #3b82f6;     /* Vibrant modern blue */
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15); /* Soft outer glow */
        }

        /* Placeholder styling */
        input[type="text"]::placeholder {
            color: #94a3b8;
        }
</style>
<script class="checkSpelling">
    document.addEventListener("DOMContentLoaded", () => {
        // Select all inputs once and loop through them
        document.querySelectorAll('input').forEach(inputField => {
            inputField.addEventListener('input', (event) => {
                const field = event.target;
                // Compare value to name and toggle the "correct" class
                const cleanWord = field.name.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                if (field.value.toLowerCase() ===cleanWord.toLowerCase()) {
                    field.classList.add("correct");
                    field.value=field.name
                } else {
                    field.classList.remove("correct");
                }
            });
        });
    });
    
    document.addEventListener("DOMContentLoaded", () => {
    // Collect all input elements into an array for easy index tracking
    const inputs = Array.from(document.querySelectorAll('input'));

    inputs.forEach((inputField, index) => {
        inputField.addEventListener('keydown', (event) => {
            // Check if the pressed key is "Enter"
            if (event.ctrlKey && event.key === 'Enter') {
                event.preventDefault(); 
                inputField.value=inputField.name
                inputField.classList.add("correct")
            }else{
            if (event.key === 'Enter') {
                event.preventDefault(); // Prevents accidental form submission
                // Find the next input in the array and focus it
                const nextInput = inputs[index + 1];
                if (nextInput) {
                    nextInput.focus();
                }
            }
            }


        });
    });


    });
</script>
