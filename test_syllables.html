  <style class="Pagination">
   html, body {
        overflow-y:scroll !important; /* Keep vertical scrolling bar*/
        height: 100%; /* Locks height to the viewport */
        background-color: transparent !important;
        }
    
    div.pagination-controls {
        width: 100% !important;
        font-size: 1 rem !important;
        position: fixed;
        bottom: 50px;
        left: 0;
        padding-right: 30px;
        display: flex;
        gap: 15px;
        align-items: center;
        z-index: 1000; /* Keeps it above other elements */
     }

   #prev-btn, #next-btn {
        width: 25%;
        height: 60px;
        border-radius: 8px;
        background-color: darkgreen;
   }

   #page-indicator {
        display: inline-block;
        padding-left: 10%;
        text-align:center;
        margin-left: auto;
        margin-right: auto;
   }

   #next-btn {
        margin-left: auto; /* 下一页按钮靠右对齐*/
   }

   .page-item {
        display: none;  /* Hide all items by default */
    }

   .page-item.active {
        display: block; /* Only show items belonging to the active page */
        height: 100% !important;
    }
  </style>

<script class="Audio-player">
   document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.audio-card').forEach(card => {
        const audio = card.querySelector('audio');
        const btn = card.querySelector('.custom-play-btn');

        // Safety check in case elements are missing
        if (!audio || !btn) return;

        btn.addEventListener('click', () => {

          // Toggle current audio playback
          if (audio.paused) {
            audio.play().catch(error => {
              console.log("Playback failed:", error);
            });
            btn.getElementsByClassName("pr")[0].style.display="inline";
          } else {
            audio.pause();
            // btn.textContent = '▶ Play';
          }
        });

        // Reset button text back to "Play" when the audio clip ends naturally
        audio.addEventListener('ended', () => {
          //btn.textContent = '▶ Play';
        });
      });
    });
</script>
<script class="syllables">
    document.addEventListener('DOMContentLoaded', () => {
    // 1. Select all buttons inside the specific container
    
    const buttons = document.querySelectorAll('.word-syllables-entry button');

    // 2. Loop through each button and track its index position
    buttons.forEach((button, index) => {
        button.addEventListener('mousedown', () => {
            if (button.className === "stress") {
                button.style.backgroundColor = 'green';
            } else {
            // For all other buttons
                button.style.backgroundColor = 'red';
            }
        });
    });
    buttons.forEach((button, index) => {
    button.addEventListener('mouseup', () => {
            if (button.className === "stress") {
                button.style.backgroundColor = 'green';
            } else {
            // For all other buttons
                button.style.backgroundColor= "#efe8e8"
            }
        });
    });
})
</script>
  <script class="Pagination">
   document.addEventListener('DOMContentLoaded', () => {
        const items = document.querySelectorAll('.page-item');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const pageIndicator = document.getElementById('page-indicator');

        let currentPage = 1;
        const itemsPerPage = 1; // Change this to how many items you want per page
        const totalPages = Math.ceil(items.length / itemsPerPage);

        function showPage(page) {
        console.log ("page=")
        console.log(page)
        console.log("totalPages=")
        console.log(totalPages)


        if(page>totalPages){page=1};// 循环
        currentPage = page;
        console.log ("currentPage=")
        console.log(currentPage)

        const start = (currentPage - 1) * itemsPerPage;
        const end = start + itemsPerPage;
        console.log("start=")
        console.log(start)
        console.log("end=")
        console.log(end)
        console.log("currentPage=")
        console.log(currentPage)

        items.forEach((item, index) => {
        if (index >= start && index < end) {
                item.classList.add('active');
                console.log ("active added")
                item.getElementsByTagName("audio")[0].play();
        } else {
                item.classList.remove('active');
        }
        });

        // Update indicator and button states
        pageIndicator.textContent = `Page ${currentPage} of ${totalPages}`;
        prevBtn.disabled = currentPage === 1;
        nextBtn.disabled = currentPage === totalPages || totalPages === 0;
        }

        prevBtn.addEventListener('click', () => {
        if (currentPage > 1) showPage(currentPage - 1);
        });

        nextBtn.addEventListener('click', () => {
        console.log("next clicked")
        if (currentPage < totalPages) {
            showPage(currentPage + 1);
        }

        });

        // Initialize first page view
        showPage(1);

        });
  </script>

</head>
